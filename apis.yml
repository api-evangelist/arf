aid: arf
name: Arf
description: >-
  Arf is a Switzerland-regulated liquidity and settlement platform for cross-border
  payments, providing short-term, receivable-backed, revolving working capital to
  licensed payment institutions and money-transfer operators. Its core product, Arf
  Liquidity, lets payment companies settle across any corridor 24/7 without prefunding
  destination accounts, using regulated real-world-asset-backed digital assets and
  stablecoins (including USDC) for native on-ramp/off-ramp value transfer and real-time
  treasury management. Arf is a compliance-first, VQF self-regulatory-organization member
  serving only licensed financial institutions, and partners with Circle, Stellar, and Visa.
  This profile was surfaced as a 500 Global portfolio company and enriched from Arf's public
  web presence; Arf does not currently publish a public developer portal or API.
